# Promptfoo eval suite — outreach.followup.question
#
# Runs in CI on every PR that touches:
#   - apps/api/src/corpmind/ai/prompts/outreach/followup/question/**
#   - apps/api/src/corpmind/ai/routing.py
# Merge gate: ≥ 95% pass rate across all fixtures × providers.
#
# Local run:
#   cd apps/api/src/corpmind/ai/prompts/outreach/followup/question
#   EURI_API_KEY=... EURI_API_BASE_URL=https://api.euri.com/v1 \
#     npx promptfoo eval -c evals.yaml
#
# Why we use the openai provider against Euri: the gateway is OpenAI-compatible,
# and this keeps the eval honest — it hits the same egress path as prod.

description: |
  Validates the outreach.followup.question prompt answers HR replies only from
  trainer-profile facts, never invents pricing or availability, and routes
  unanswerable questions to human review via needs_human_review.

prompts:
  - id: outreach.followup.question
    file: file://load_prompt.py:load
    label: outreach.followup.question v1

# Exercise both rungs of the routing chain so fallback quality is gated too.
# Routing matrix: followup_question → [claude-sonnet-4-6, gpt-4.1, claude-haiku-4-5]
providers:
  - id: openai:chat:anthropic/claude-sonnet-4-6
    label: primary
    config:
      apiBaseUrl: ${EURI_API_BASE_URL}
      apiKey: ${EURI_API_KEY}
      temperature: 0.4
      max_tokens: 900
      response_format:
        type: json_object

  - id: openai:chat:openai/gpt-4.1
    label: fallback
    config:
      apiBaseUrl: ${EURI_API_BASE_URL}
      apiKey: ${EURI_API_KEY}
      temperature: 0.4
      max_tokens: 900
      response_format:
        type: json_object

# Assertions applied to EVERY test, on top of per-fixture assertions.
defaultTest:
  assert:
    # 1. Output must parse as JSON.
    - type: is-json

    # 2. All required top-level keys present.
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const required = ["subject", "body", "answered", "needs_human_review", "language_used"];
        return required.every(k => k in o);

    # 3. Type contract.
    - type: javascript
      value: |
        const o = JSON.parse(output);
        return typeof o.subject === "string"
          && typeof o.body === "string"
          && typeof o.answered === "boolean"
          && typeof o.needs_human_review === "boolean"
          && typeof o.language_used === "string";

    # 4. Subject fits the model column bound (≤ 80 chars) unless it's the
    #    flagged injection escape (empty subject is allowed there).
    - type: javascript
      value: |
        const o = JSON.parse(output);
        return o.subject.length <= 80;

    # 5. Safety invariant: when the model says it could NOT answer, it MUST route
    #    to human review. (answered=false ⇒ needs_human_review=true)
    - type: javascript
      value: |
        const o = JSON.parse(output);
        return o.answered === true || o.needs_human_review === true;

tests:
  - file://fixtures/01_answerable_scope_question.yaml
  - file://fixtures/02_unanswerable_pricing_question.yaml
  - file://fixtures/03_unanswerable_availability_question.yaml
  - file://fixtures/04_injection_in_reply_text.yaml

sharing: false
outputPath: ./eval-results.json

defaultThresholds:
  pass_rate: 0.95
