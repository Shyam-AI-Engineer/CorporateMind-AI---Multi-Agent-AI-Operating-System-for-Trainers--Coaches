[project]
name = "corpmind-api"
version = "0.1.0"
description = "CorporateMind AI — FastAPI backend + Celery workers"
requires-python = ">=3.12"

dependencies = [
    # ── Web framework ──────────────────────────────────────────────────────────
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "httpx>=0.28",

    # ── Database ───────────────────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "greenlet>=3.1",

    # ── Redis ──────────────────────────────────────────────────────────────────
    "redis[hiredis]>=5.2",

    # ── Config & validation ────────────────────────────────────────────────────
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pydantic[email]>=2.10",

    # ── Auth / Security ────────────────────────────────────────────────────────
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "cryptography>=44",

    # ── Async task queue ───────────────────────────────────────────────────────
    "celery[redis]>=5.4",

    # ── AI / LangGraph ─────────────────────────────────────────────────────────
    "langgraph>=0.2",
    "langchain-core>=0.3",

    # ── Observability ──────────────────────────────────────────────────────────
    "structlog>=24.4",
    "langfuse>=2.57",
    "sentry-sdk[fastapi]>=2.19",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "opentelemetry-instrumentation-redis>=0.50b0",
    "prometheus-fastapi-instrumentator>=7.0",

    # ── Vector / Search ────────────────────────────────────────────────────────
    "qdrant-client[fastembed]>=1.12",
    "meilisearch-python-sdk>=3.4",

    # ── PII & safety ──────────────────────────────────────────────────────────
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",

    # ── File processing ────────────────────────────────────────────────────────
    "python-magic>=0.4",
    "Pillow>=11.0",
    "pypdf>=5.1",

    # ── Email delivery ─────────────────────────────────────────────────────────
    "aiosmtplib>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",           # AsyncClient for API tests
    "testcontainers[postgres,redis]>=4.8",
    "freezegun>=1.5",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-passlib",
    "types-python-jose",
    "factory-boy>=3.3",
    "faker>=33.0",
    "respx>=0.21",           # httpx mocking
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corpmind"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "S",        # flake8-bandit (security)
    "TCH",      # type-checking imports
    "RUF",      # ruff-specific
]
ignore = [
    "S101",  # assert in tests
    "B008",  # function calls in default args (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "langfuse.*",
    "presidio_analyzer.*",
    "presidio_anonymizer.*",
    "meilisearch.*",
    "celery.*",
    "kombu.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src/corpmind --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
source = ["src/corpmind"]
omit = ["*/tests/*", "*/migrations/*"]
