name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend lint + type-check ───────────────────────────────────────────────
  api-lint:
    name: API lint & type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv==0.5.13

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check src/ tests/

      - name: Mypy type-check
        run: uv run mypy src/

  # ── Backend tests ───────────────────────────────────────────────────────────
  api-test:
    name: API tests
    runs-on: ubuntu-latest
    needs: api-lint
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: corpmind_test
          POSTGRES_USER: corpmind
          POSTGRES_PASSWORD: corpmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://corpmind:corpmind@localhost:5432/corpmind_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      APP_SECRET_KEY: ci-test-secret-key-at-least-32-chars
      EURI_API_KEY: ci-test-euri-key
      JWT_PRIVATE_KEY: ""
      JWT_PUBLIC_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv==0.5.13

      - name: Install dependencies (including dev)
        run: uv sync

      - name: Run Alembic migrations (upgrade)
        run: uv run alembic upgrade head

      - name: Verify migration downgrade (round-trip)
        # Confirms every migration is reversible — catches missing downgrade()
        # implementations and schema constraints that prevent reversal.
        run: |
          uv run alembic downgrade -1
          uv run alembic upgrade head

      - name: Run tests with coverage gate
        # --cov-fail-under=70 is also in pyproject.toml addopts, but we make
        # it explicit here so CI output names it as a distinct failure reason.
        run: uv run pytest -q --tb=short --cov-fail-under=70

  # ── Secret scanning ─────────────────────────────────────────────────────────
  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Frontend lint + type-check ──────────────────────────────────────────────
  web-lint:
    name: Web lint & type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

  # ── Frontend tests ──────────────────────────────────────────────────────────
  web-test:
    name: Web tests
    runs-on: ubuntu-latest
    needs: web-lint
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Run Vitest
        run: pnpm test

  # ── Prompt evals (Promptfoo) ────────────────────────────────────────────────
  # Runs ONLY when a prompt template or the routing matrix changes.
  # Requires EURI_API_KEY + EURI_API_BASE_URL as repo secrets to hit the live
  # gateway. Without them, the job validates structure only (YAML parse + fixture
  # load) — sufficient as a scaffold until secrets are configured.
  prompt-evals:
    name: Prompt evals
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed prompt files
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            prompts:
              - 'apps/api/src/corpmind/ai/prompts/**'
              - 'apps/api/src/corpmind/ai/routing.py'

      - name: Set up Node 20
        if: steps.changes.outputs.prompts == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install promptfoo
        if: steps.changes.outputs.prompts == 'true'
        run: npm install -g promptfoo@0.95

      - name: Validate eval configs (structure)
        if: steps.changes.outputs.prompts == 'true'
        run: |
          for cfg in $(find apps/api/src/corpmind/ai/prompts -name evals.yaml); do
            echo "→ validating $cfg"
            promptfoo validate -c "$cfg"
          done

      - name: Run trainer.extraction evals (live, if secrets set)
        if: steps.changes.outputs.prompts == 'true' && env.EURI_API_KEY != ''
        working-directory: apps/api/src/corpmind/ai/prompts/trainer/extraction
        env:
          EURI_API_KEY: ${{ secrets.EURI_API_KEY }}
          EURI_API_BASE_URL: ${{ secrets.EURI_API_BASE_URL }}
        run: promptfoo eval -c evals.yaml --no-progress-bar

  # ── Docker build + health check verification ─────────────────────────────────
  docker-build:
    name: Docker build (API)
    runs-on: ubuntu-latest
    needs: [api-test, web-test, secret-scan]
    # Build on every PR and every push to main (not just main) so broken
    # Dockerfiles are caught before merge, not after.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: corpmind-api:${{ github.sha }}

      - name: Verify Docker HEALTHCHECK instruction present
        # Confirms HEALTHCHECK was not accidentally removed from the Dockerfile.
        run: |
          docker inspect --format='{{json .Config.Healthcheck}}' \
            corpmind-api:${{ github.sha }} | grep -v 'null' \
            || (echo "ERROR: Docker HEALTHCHECK is missing" && exit 1)
